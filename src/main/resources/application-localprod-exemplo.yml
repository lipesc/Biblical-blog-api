spring:
  config:
    activate:
      on-profile: localprod
server:
  port: 8081
  ssl:
    enabled: false 

  datasource:
    url: 
    username: 
    password: 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt: 
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/biblical-blog-api}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: biblical-blog-api
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin:
    username: 
    password: 
